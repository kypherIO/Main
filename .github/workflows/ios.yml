name: iOS build
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    name: SkyfoldCore tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test simulation package
        working-directory: ios/Packages/SkyfoldCore
        run: swift test
      - name: Stress test (optimized build, shipping performance)
        working-directory: ios/Packages/SkyfoldCore
        run: swift test -c release -Xswiftc -enable-testing --filter StressTests 2>&1 | grep -E "STRESS|measured|Executed|error|failed" 
  xcode:
    name: Xcode build (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"; sudo xcode-select -s "$XC"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Skyfold.xcodeproj -scheme Skyfold -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-sim.log
      - name: Build for iOS device (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Skyfold.xcodeproj -scheme Skyfold -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-device.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ios/build-*.log
