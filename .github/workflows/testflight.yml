# Build, sign and upload Skyfold to TestFlight so it can be installed on your
# iPhone from the TestFlight app. Run it from the Actions tab ("Run workflow").
#
# One-time setup — add these repository secrets (Settings → Secrets → Actions):
#   APPLE_TEAM_ID      10-character Apple Developer Team ID
#   ASC_KEY_ID         App Store Connect API key ID          (Users and Access → Integrations → Keys)
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64  base64 of the AuthKey_XXXX.p8 file   (base64 -i AuthKey_XXXX.p8 | pbcopy)
# and create the app record in App Store Connect with bundle ID com.kypher.skyfold.
#
# Runs automatically on every push that touches ios/ (and on demand). With
# "Automatic Updates" enabled for Skyfold in the TestFlight app, each build
# installs itself on your iPhone. Until the secrets exist, the job skips cleanly.
name: TestFlight
on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', '.github/workflows/testflight.yml']
  workflow_dispatch:
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY" ] && [ -n "$ISSUER" ] && [ -n "$P8" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::TestFlight skipped — add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 secrets to enable automatic installs."; fi
  testflight:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate project
        working-directory: ios
        run: brew install xcodegen && xcodegen
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Skyfold.xcodeproj -scheme Skyfold -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Skyfold.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log" || { tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
      - name: Upload to TestFlight
        working-directory: ios
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Skyfold.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
          echo "Uploaded build ${{ github.run_number }} — it appears in TestFlight after Apple finishes processing (~10–30 min)."
